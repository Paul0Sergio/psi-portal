<!DOCTYPE html>
<html lang="pt-BR" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal PSI | Autenticação Segura</title>
  <meta name="description" content="Acesso restrito ao Portal de Políticas de Segurança da Informação e Conformidade (ISO 27001 e LGPD)">
  
  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Estilos Personalizados -->
  <link rel="stylesheet" href="/css/custom.css">
</head>
<body class="min-h-full bg-slate-50 bg-grid-pattern text-slate-800 flex flex-col justify-between selection:bg-emerald-500 selection:text-white relative">

  <!-- Luzes de Fundo Decorativas Suaves (Ambient Glows) -->
  <div class="fixed top-0 left-1/4 w-[500px] h-[350px] bg-emerald-500/5 rounded-full blur-[140px] pointer-events-none -z-10"></div>
  <div class="fixed bottom-0 right-1/4 w-[500px] h-[350px] bg-blue-500/5 rounded-full blur-[140px] pointer-events-none -z-10"></div>

  <!-- Cabeçalho Mínimo Corporativo -->
  <header class="w-full max-w-7xl mx-auto px-6 py-5 flex items-center justify-between">
    <div class="flex items-center gap-3.5">
      <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-emerald-600 to-teal-500 flex items-center justify-center shadow-md shadow-emerald-500/20 text-white">
        <i data-lucide="shield-check" class="w-6 h-6 stroke-[2.5]"></i>
      </div>
      <div>
        <div class="flex items-center gap-2">
          <span class="font-extrabold text-lg tracking-tight text-slate-900">Portal PSI</span>
          <span class="text-[10px] uppercase font-bold tracking-wider px-2 py-0.5 rounded-full bg-emerald-50 text-emerald-700 border border-emerald-200 font-mono">
            v2.6
          </span>
        </div>
        <p class="text-xs text-slate-500 hidden sm:block">Políticas & Controles de Segurança da Informação</p>
      </div>
    </div>
  </header>

  <!-- Container Central do Formulário de Login -->
  <main class="w-full max-w-md mx-auto px-4 py-8 flex-1 flex flex-col justify-center">
    <div class="bg-white rounded-2xl p-7 sm:p-8 shadow-xl shadow-slate-200/70 relative overflow-hidden border border-slate-200">
      
      <!-- Faixa de Destaque Superior -->
      <div class="absolute top-0 left-0 right-0 h-1.5 bg-gradient-to-r from-emerald-500 via-teal-500 to-blue-600"></div>

      <!-- Título e Subtítulo -->
      <div class="text-center mb-6">
        <div class="inline-flex items-center justify-center w-12 h-12 rounded-2xl bg-emerald-50 border border-emerald-100 mb-3 shadow-xs text-emerald-600">
          <i data-lucide="key-round" class="w-6 h-6 stroke-[2.2]"></i>
        </div>
        <h1 class="text-2xl font-extrabold text-slate-900 tracking-tight">Autenticação de Acesso</h1>
        <p class="text-xs sm:text-sm text-slate-500 mt-1 leading-relaxed">Insira suas credenciais corporativas para acessar o painel de conformidade e controles.</p>
      </div>

      <!-- Alerta Dinâmico de Feedback -->
      <div id="loginAlert" class="hidden mb-5 p-3.5 rounded-xl text-xs font-semibold flex items-start gap-2.5 transition-all">
        <i id="alertIcon" data-lucide="alert-circle" class="w-4 h-4 shrink-0 mt-0.5"></i>
        <div id="alertMessage" class="flex-1"></div>
      </div>

      <!-- Formulário de Autenticação -->
      <form id="loginForm" class="space-y-4" novalidate>
        
        <!-- Campo: Usuário -->
        <div>
          <label for="username" class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5 flex items-center justify-between">
            <span>Usuário do Sistema</span>
            <span class="text-[10px] text-slate-400 font-normal">Identificador</span>
          </label>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
              <i data-lucide="user" class="w-4 h-4"></i>
            </div>
            <input 
              type="text" 
              id="username" 
              name="username" 
              required 
              autocomplete="username"
              placeholder="ex: admin"
              class="glass-input w-full pl-10 pr-4 py-2.5 rounded-xl text-sm text-slate-900 placeholder-slate-400 bg-slate-50/50 border border-slate-200 focus:bg-white focus:border-emerald-500"
            >
          </div>
        </div>

        <!-- Campo: Senha -->
        <div>
          <label for="password" class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5 flex items-center justify-between">
            <span>Senha de Acesso</span>
            <span class="text-[10px] text-slate-400 font-normal">Criptografia forte</span>
          </label>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
              <i data-lucide="lock" class="w-4 h-4"></i>
            </div>
            <input 
              type="password" 
              id="password" 
              name="password" 
              required 
              autocomplete="current-password"
              placeholder="••••••••••••"
              class="glass-input w-full pl-10 pr-10 py-2.5 rounded-xl text-sm text-slate-900 placeholder-slate-400 bg-slate-50/50 border border-slate-200 focus:bg-white focus:border-emerald-500 font-mono"
            >
            <button 
              type="button" 
              id="togglePassword" 
              aria-label="Alternar visibilidade da senha"
              class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-slate-400 hover:text-slate-600 transition-colors"
            >
              <i data-lucide="eye" id="eyeIcon" class="w-4 h-4"></i>
            </button>
          </div>
        </div>

        <!-- Botão de Submissão -->
        <button 
          type="submit" 
          id="submitBtn"
          class="w-full py-3 px-4 rounded-xl bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 text-white font-bold text-sm tracking-wide shadow-md shadow-emerald-600/20 hover:shadow-emerald-600/30 transition-all flex items-center justify-center gap-2 mt-2 group active:scale-[0.99] cursor-pointer"
        >
          <span id="btnText">Acessar Painel de Controles</span>
          <i data-lucide="arrow-right" class="w-4 h-4 group-hover:translate-x-1 transition-transform"></i>
          <span id="btnSpinner" class="hidden animate-spin w-4 h-4 border-2 border-white border-t-transparent rounded-full"></span>
        </button>

      </form>
    </div>

  </main>

  <!-- Rodapé Global -->
  <footer class="w-full px-6 py-4 text-center text-xs text-slate-500 border-t border-slate-200 bg-white/70 backdrop-blur-xs">
    <p>Portal Institucional de Governança e Cibersegurança &copy; 2026 — Conformidade ISO/IEC 27001 & LGPD</p>
  </footer>

  <!-- Script da Página de Login -->
  <script src="/js/login.js"></script>
</body>
</html>
